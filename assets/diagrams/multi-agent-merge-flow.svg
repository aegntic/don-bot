<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Don-Bot Multi-Agent Worktree Delegation and Writer Lease Merge Flow">
  <defs>
    <linearGradient id="bgFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090c11"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <marker id="arrIce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fc1ff"/>
    </marker>
    <marker id="arrOrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff5a1f"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="18" fill="url(#bgFlow)" stroke="#243144" stroke-width="1.5"/>

  <text x="40" y="42" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="2">02 // EXECUTION PIPELINE · don team "&lt;goal&gt;" --merge</text>
  <text x="40" y="70" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="700">Live Multi-Agent Delegation, Isolated Worktrees &amp; Serialized Writer Lease</text>

  <!-- Stage 1: Operator + Complexity Router -->
  <rect x="40" y="108" width="210" height="106" rx="12" fill="#141b27" stroke="#3fc1ff" stroke-width="1.2"/>
  <text x="58" y="134" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">1. GOAL ROUTER</text>
  <text x="58" y="158" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Jev Complexity Gate</text>
  <text x="58" y="179" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Solo -&gt; Specialist direct</text>
  <text x="58" y="196" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Multi -&gt; Open Debate Room</text>

  <line x1="250" y1="161" x2="294" y2="161" stroke="#3fc1ff" stroke-width="2" marker-end="url(#arrIce)"/>

  <!-- Stage 2: Lead Orchestrator -->
  <rect x="300" y="96" width="250" height="130" rx="12" fill="#141b27" stroke="#ff5a1f" stroke-width="1.4"/>
  <text x="318" y="122" fill="#ff8a4c" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">2. LEAD ORCHESTRATOR</text>
  <text x="318" y="146" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">canWriteCode = false</text>
  <text x="318" y="168" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">· 3-round @mention contract</text>
  <text x="318" y="186" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">· delegate_to_specialist tool</text>
  <text x="318" y="204" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">· BatchToolSummarizer (3x)</text>

  <!-- Branch Arrows from Lead to 3 Worktree Lanes -->
  <path d="M 550 135 C 585 135, 585 104, 616 104" fill="none" stroke="#3fc1ff" stroke-width="1.8" marker-end="url(#arrIce)"/>
  <path d="M 550 161 L 616 161" fill="none" stroke="#3fc1ff" stroke-width="1.8" marker-end="url(#arrIce)"/>
  <path d="M 550 188 C 585 188, 585 218, 616 218" fill="none" stroke="#3fc1ff" stroke-width="1.8" marker-end="url(#arrIce)"/>

  <!-- Stage 3: Isolated Worktrees -->
  <rect x="622" y="82" width="265" height="44" rx="9" fill="#090c11" stroke="#3fc1ff" stroke-opacity="0.7"/>
  <text x="638" y="102" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">api-keeper Worktree</text>
  <text x="638" y="118" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">CodingTools · isolated SQLite WAL</text>

  <rect x="622" y="139" width="265" height="44" rx="9" fill="#090c11" stroke="#3fc1ff" stroke-opacity="0.7"/>
  <text x="638" y="159" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">pipeline-forge Worktree</text>
  <text x="638" y="175" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">shared node_modules + target links</text>

  <rect x="622" y="196" width="265" height="44" rx="9" fill="#090c11" stroke="#3fc1ff" stroke-opacity="0.7"/>
  <text x="638" y="216" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">client-qa Worktree</text>
  <text x="638" y="232" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">Verifier · UI + integration checks</text>

  <!-- Converge to Verification Gates -->
  <path d="M 887 104 C 915 104, 915 161, 942 161" fill="none" stroke="#3fc1ff" stroke-width="1.8"/>
  <line x1="887" y1="161" x2="942" y2="161" stroke="#3fc1ff" stroke-width="1.8" marker-end="url(#arrIce)"/>
  <path d="M 887 218 C 915 218, 915 161, 942 161" fill="none" stroke="#3fc1ff" stroke-width="1.8"/>

  <!-- Stage 4: Verification Loop -->
  <rect x="948" y="96" width="212" height="130" rx="12" fill="#141b27" stroke="#3fc1ff" stroke-width="1.3"/>
  <text x="966" y="122" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">4. VERIFY GATES</text>
  <text x="966" y="146" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">oxc.rs + SkillEval</text>
  <text x="966" y="168" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">· oxlint + oxfmt + test</text>
  <text x="966" y="186" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">· maxVerifierLoops repair</text>
  <text x="966" y="204" fill="#ff8a4c" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">· Cooldown @ 2f / 3v</text>

  <!-- Step down to Bottom Merge Strip -->
  <path d="M 1054 226 L 1054 274" fill="none" stroke="#3fc1ff" stroke-width="2" marker-end="url(#arrIce)"/>

  <!-- Bottom Row (Right to Left: Commit -> Writer Lease Merge -> Push Block Gate) -->
  <rect x="850" y="280" width="310" height="126" rx="12" fill="#141b27" stroke="#2a364a" stroke-width="1.2"/>
  <text x="868" y="306" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">5. commitWorktreeChanges()</text>
  <text x="868" y="330" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Clean Diff Commit</text>
  <text x="868" y="352" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Stages only verified source diffs</text>
  <text x="868" y="370" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Excludes .don/, node_modules, target/</text>
  <text x="868" y="388" fill="#8edcff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Returns worktreeCommitSha</text>

  <line x1="850" y1="343" x2="804" y2="343" stroke="#3fc1ff" stroke-width="2" marker-end="url(#arrIce)"/>

  <rect x="456" y="280" width="342" height="126" rx="12" fill="#141b27" stroke="#3fc1ff" stroke-width="1.4"/>
  <text x="474" y="306" fill="#3fc1ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">6. SERIALIZED WRITER LEASE</text>
  <text x="474" y="330" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">mergeWorktreeIntoMain()</text>
  <text x="474" y="352" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Acquires .don/writer.lease.json</text>
  <text x="474" y="370" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Clean --no-ff merge or conflict abort</text>
  <text x="474" y="388" fill="#8edcff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">Prunes merged worktree on success</text>

  <line x1="456" y1="343" x2="410" y2="343" stroke="#ff5a1f" stroke-width="2" marker-end="url(#arrOrg)"/>

  <rect x="40" y="280" width="364" height="126" rx="12" fill="#141b27" stroke="#ff5a1f" stroke-width="1.5"/>
  <text x="58" y="306" fill="#ff5a1f" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700">7. HARD STOP · NO AUTO-PUSH</text>
  <text x="58" y="330" fill="#f3f5f9" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Owner DecisionCard Required</text>
  <text x="58" y="352" fill="#9aa7bc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">assertGitPushAllowed() blocks push until:</text>
  <text x="58" y="370" fill="#f3f5f9" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">[✓] Approved git_push DecisionCard</text>
  <text x="58" y="388" fill="#f3f5f9" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">[✓] Zero secrets in scanTextForSecrets()</text>
</svg>
