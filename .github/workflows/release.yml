name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6.0); defaults to github.ref_name'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-don-guard:
    name: Build don-guard (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: don-guard-linux-x86_64
            bin: don-guard
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: don-guard-macos-aarch64
            bin: don-guard
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: don-guard-macos-x86_64
            bin: don-guard
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: don-guard-windows-x86_64.exe
            bin: don-guard.exe
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test don-guard
        if: ${{ !matrix.cross }}
        run: cargo test --manifest-path crates/don-guard/Cargo.toml

      - name: Build don-guard release binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path crates/don-guard/Cargo.toml

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "crates/don-guard/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-don-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum don-guard-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "Error: could not resolve release tag" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            case "$TAG" in
              *-*) PRERELEASE_FLAG="--prerelease" ;;
            esac
            gh release create "$TAG" $PRERELEASE_FLAG --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/don-guard-* dist/SHA256SUMS.txt --clobber
